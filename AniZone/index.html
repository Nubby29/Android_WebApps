<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AniZone — Anime Streaming</title>
<style>
  /* =========================================================
     REUSABLE DESIGN TOKENS
     These tokens are the reusable "design assets" that
     any anime theme can override without changing components.
     ========================================================= */
  :root {
    /* Spacing scale */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;

    /* Radius scale */
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --radius-pill: 999px;

    /* Type scale */
    --font-display: "Bebas Neue", "Impact", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --text-xs: 12px;
    --text-sm: 14px;
    --text-md: 16px;
    --text-lg: 20px;
    --text-xl: 28px;
    --text-2xl: 40px;

    /* Motion */
    --ease: cubic-bezier(.22,.61,.36,1);
    --dur-fast: 150ms;
    --dur-med: 300ms;

    /* Component base (theme overrides) */
    --bg: #0b0d12;
    --bg-elev: #141821;
    --bg-card: #1b2030;
    --surface-line: rgba(255,255,255,0.08);
    --text: #e8ecf5;
    --text-muted: #9aa3b8;

    --primary: #ff4d6d;
    --primary-ink: #0b0d12;
    --accent: #7c5cff;

    --grad-hero: linear-gradient(135deg, #ff4d6d 0%, #7c5cff 100%);
    --grad-card: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0));
    --shadow-card: 0 10px 30px rgba(0,0,0,0.35);
    --glow: 0 0 0 3px rgba(124, 92, 255, 0.35);

    /* Reusable background pattern slot — themes supply a gradient */
    --pattern-a: radial-gradient(800px 400px at 10% -10%, rgba(255,77,109,0.25), transparent 60%);
    --pattern-b: radial-gradient(600px 300px at 100% 0%, rgba(124,92,255,0.25), transparent 60%);

    /* Decorative motif */
    --motif: none;
  }

  /* ============== THEME PACKS (per-anime assets) ============== */
  /* Demon Slayer — crimson + black + gold */
  [data-theme="demonslayer"] {
    --primary: #e63946;
    --accent: #f6c453;
    --grad-hero: linear-gradient(135deg, #e63946 0%, #1a0a0a 100%);
    --grad-card: linear-gradient(180deg, rgba(246,196,83,0.10), rgba(0,0,0,0));
    --pattern-a: radial-gradient(700px 380px at 0% 0%, rgba(230,57,70,0.35), transparent 60%);
    --pattern-b: radial-gradient(600px 300px at 100% 0%, rgba(246,196,83,0.18), transparent 60%);
    --motif:
      repeating-linear-gradient(45deg, rgba(246,196,83,0.05) 0 2px, transparent 2px 14px);
  }

  /* Jujutsu Kaisen — indigo + violet + cyan */
  [data-theme="jujutsu"] {
    --primary: #7c5cff;
    --accent: #22d3ee;
    --grad-hero: linear-gradient(135deg, #7c5cff 0%, #22d3ee 100%);
    --grad-card: linear-gradient(180deg, rgba(34,211,238,0.10), rgba(0,0,0,0));
    --pattern-a: radial-gradient(700px 380px at 0% 0%, rgba(124,92,255,0.35), transparent 60%);
    --pattern-b: radial-gradient(600px 300px at 100% 0%, rgba(34,211,238,0.25), transparent 60%);
    --motif:
      radial-gradient(circle at 1px 1px, rgba(34,211,238,0.12) 1px, transparent 1.5px) 0 0/22px 22px;
  }

  /* One Piece — warm sunset + ocean */
  [data-theme="onepiece"] {
    --primary: #ff7e3c;
    --accent: #2ec4b6;
    --grad-hero: linear-gradient(135deg, #ff7e3c 0%, #2ec4b6 100%);
    --grad-card: linear-gradient(180deg, rgba(255,126,60,0.10), rgba(0,0,0,0));
    --pattern-a: radial-gradient(700px 380px at 0% 0%, rgba(255,126,60,0.35), transparent 60%);
    --pattern-b: radial-gradient(600px 300px at 100% 0%, rgba(46,196,182,0.30), transparent 60%);
    --motif:
      repeating-linear-gradient(0deg, rgba(46,196,182,0.07) 0 1px, transparent 1px 18px);
  }

  /* Spy x Family — pastel pink + cream */
  [data-theme="spyfamily"] {
    --bg: #0f0a14;
    --bg-elev: #1a1322;
    --bg-card: #221830;
    --primary: #ff8fb1;
    --accent: #ffd166;
    --grad-hero: linear-gradient(135deg, #ff8fb1 0%, #ffd166 100%);
    --grad-card: linear-gradient(180deg, rgba(255,209,102,0.10), rgba(0,0,0,0));
    --pattern-a: radial-gradient(700px 380px at 0% 0%, rgba(255,143,177,0.35), transparent 60%);
    --pattern-b: radial-gradient(600px 300px at 100% 0%, rgba(255,209,102,0.25), transparent 60%);
    --motif:
      radial-gradient(circle at 1px 1px, rgba(255,143,177,0.10) 1px, transparent 1.5px) 0 0/18px 18px;
  }

  /* Chainsaw Man — gritty red + black */
  [data-theme="chainsaw"] {
    --primary: #ff2d2d;
    --accent: #ffffff;
    --grad-hero: linear-gradient(135deg, #ff2d2d 0%, #0b0d12 100%);
    --grad-card: linear-gradient(180deg, rgba(255,45,45,0.10), rgba(0,0,0,0));
    --pattern-a: radial-gradient(700px 380px at 0% 0%, rgba(255,45,45,0.30), transparent 60%);
    --pattern-b: radial-gradient(600px 300px at 100% 0%, rgba(255,255,255,0.10), transparent 60%);
    --motif:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 10px);
  }

  /* Frieren — twilight purple + gold */
  [data-theme="frieren"] {
    --primary: #9b5de5;
    --accent: #f6c453;
    --grad-hero: linear-gradient(135deg, #4a1d6e 0%, #f6c453 100%);
    --grad-card: linear-gradient(180deg, rgba(155,93,229,0.10), rgba(0,0,0,0));
    --pattern-a: radial-gradient(700px 380px at 0% 0%, rgba(155,93,229,0.35), transparent 60%);
    --pattern-b: radial-gradient(600px 300px at 100% 0%, rgba(246,196,83,0.20), transparent 60%);
    --motif:
      radial-gradient(circle at 1px 1px, rgba(246,196,83,0.12) 1px, transparent 1.5px) 0 0/20px 20px;
  }

  /* ===================== BASE ===================== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    line-height: 1.5;
    transition: background var(--dur-med) var(--ease), color var(--dur-med) var(--ease);
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  /* ============== LAYOUT ============== */
  .app {
    min-height: 100vh;
    background-image: var(--pattern-a), var(--pattern-b), var(--motif);
  }
  @media (min-width: 861px) { .app { background-attachment: fixed; } }

  /* NAVBAR (reusable) */
  .nav {
    display: flex; align-items: center; gap: var(--space-5);
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--surface-line);
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in oklab, var(--bg) 70%, transparent);
  }
  .nav-inner {
    display: flex; align-items: center; gap: var(--space-5);
    width: 100%;
    max-width: 1400px; margin: 0 auto;
  }
  .brand {
    font-family: var(--font-display);
    font-size: var(--text-xl);
    letter-spacing: 2px;
    background: var(--grad-hero);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .nav-links { display: flex; gap: var(--space-5); flex: 1; }
  .nav-link {
    color: var(--text-muted);
    font-size: var(--text-sm);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-pill);
    transition: color var(--dur-fast), background var(--dur-fast);
  }
  .nav-link:hover, .nav-link[aria-current="page"] {
    color: var(--text);
    background: var(--bg-card);
  }

  /* THEME SWITCHER (reusable) */
  .theme-switcher {
    display: flex; gap: var(--space-2); align-items: center;
  }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--surface-line);
    background: var(--grad-hero);
    cursor: pointer;
    transition: transform var(--dur-fast), box-shadow var(--dur-fast);
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch[aria-pressed="true"] { box-shadow: var(--glow); }
  .swatch:focus-visible,
  .card:focus-visible,
  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* HERO (reusable) */
  .hero {
    display: grid; grid-template-columns: 1.4fr 1fr;
    gap: var(--space-6);
    padding: var(--space-7) var(--space-6);
    align-items: stretch;
  }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }

  .hero-card {
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--bg-elev);
    border: 1px solid var(--surface-line);
    box-shadow: var(--shadow-card);
    min-height: 380px;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: var(--space-6);
  }
  .hero-art {
    position: absolute; inset: 0;
    background: var(--grad-hero);
    overflow: hidden;
  }
  .hero-art img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(1.1);
  }
  .hero-art::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.10), transparent 40%),
      linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.85));
  }
  .hero-eyebrow {
    position: relative;
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--accent);
  }
  .hero-title {
    position: relative;
    font-family: var(--font-display);
    font-size: clamp(36px, 6vw, 64px);
    line-height: 1;
    margin: var(--space-2) 0 var(--space-3);
  }
  .hero-meta {
    position: relative;
    color: var(--text);
    opacity: 0.9;
    font-size: var(--text-sm);
    display: flex; gap: var(--space-3); flex-wrap: wrap;
  }
  .hero-actions {
    position: relative;
    display: flex; gap: var(--space-3); margin-top: var(--space-5);
  }

  /* SIDE PANEL (reusable) */
  .side-card {
    background: var(--bg-elev);
    border: 1px solid var(--surface-line);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    display: flex; flex-direction: column; gap: var(--space-4);
  }
  .side-card h3 {
    margin: 0; font-size: var(--text-lg);
  }

  /* BUTTONS (reusable) */
  .btn {
    --bg-btn: var(--primary);
    --fg-btn: var(--primary-ink);
    background: var(--bg-btn);
    color: var(--fg-btn);
    border: 1px solid transparent;
    padding: var(--space-3) var(--space-5);
    border-radius: var(--radius-pill);
    font-weight: 600;
    font-size: var(--text-sm);
    display: inline-flex; align-items: center; gap: var(--space-2);
    transition: transform var(--dur-fast), filter var(--dur-fast);
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn--ghost {
    --bg-btn: transparent;
    --fg-btn: var(--text);
    border-color: var(--surface-line);
    backdrop-filter: blur(6px);
  }

  /* SECTION HEADING (reusable) */
  .section {
    padding: var(--space-6);
  }
  .section-head {
    display: flex; align-items: end; justify-content: space-between;
    margin-bottom: var(--space-5);
  }
  .section-title {
    font-family: var(--font-display);
    font-size: var(--text-xl);
    letter-spacing: 1px;
  }
  .section-sub { color: var(--text-muted); font-size: var(--text-sm); }

  /* ANIME CARD (reusable) */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: var(--space-5);
  }
  .card {
    position: relative;
    border-radius: var(--radius-md);
    overflow: hidden;
    background: transparent;
    border: 1px solid var(--surface-line);
    transition: transform var(--dur-med) var(--ease), box-shadow var(--dur-med);
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    width: 100%;
    padding: 0;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); }
  .card-art {
    aspect-ratio: 3/4;
    background: var(--grad-hero);
    position: relative;
    overflow: hidden;
  }
  .card-art::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: shimmer 1.4s var(--ease) infinite;
    z-index: 0;
  }
  .card-art.is-loaded::before { display: none; }
  .card-art img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity var(--dur-med), transform var(--dur-med) var(--ease);
    position: relative; z-index: 1;
  }
  .card-art.is-loaded img { opacity: 1; }
  .card:hover .card-art img { transform: scale(1.05); }
  .card-art::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7));
    pointer-events: none;
    z-index: 2;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .card-rank {
    position: absolute; top: var(--space-3); left: var(--space-3);
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--surface-line);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    font-size: var(--text-xs);
    font-weight: 700;
  }
  .card-body { padding: var(--space-3) var(--space-4) var(--space-4); }
  .card-title {
    font-size: var(--text-md);
    font-weight: 700;
    margin: 0 0 var(--space-1);
  }
  .card-meta { color: var(--text-muted); font-size: var(--text-xs); display: flex; gap: var(--space-2); }

  /* BADGE (reusable) */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    background: var(--grad-card);
    border: 1px solid var(--surface-line);
    font-size: var(--text-xs);
    color: var(--text);
  }
  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
  }

  /* EPISODE LIST (reusable) */
  .episodes {
    display: flex; flex-direction: column; gap: var(--space-2);
  }
  .episode {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3);
    border-radius: var(--radius-md);
    background: var(--bg-card);
    border: 1px solid var(--surface-line);
  }
  .episode-num {
    font-family: var(--font-display);
    font-size: var(--text-lg);
    color: var(--primary);
    text-align: center;
  }
  .episode-title { font-size: var(--text-sm); font-weight: 600; }
  .episode-time { color: var(--text-muted); font-size: var(--text-xs); }

  /* FOOTER */
  .footer {
    padding: var(--space-6);
    border-top: 1px solid var(--surface-line);
    color: var(--text-muted);
    text-align: center;
    font-size: var(--text-xs);
  }
</style>
</head>
<body data-theme="jujutsu">
  <div class="app">

    <!-- NAVBAR -->
    <nav class="nav" aria-label="Primary">
      <div class="nav-inner">
        <div class="brand">ANIZONE</div>
        <div class="nav-links">
          <a class="nav-link" href="#" aria-current="page">Home</a>
          <a class="nav-link" href="#">Series</a>
          <a class="nav-link" href="#">Movies</a>
          <a class="nav-link" href="#">Schedule</a>
          <a class="nav-link" href="#">My List</a>
        </div>
        <div class="theme-switcher" role="group" aria-label="Theme">
          <button class="swatch" data-set="jujutsu"      aria-label="Jujutsu Kaisen"></button>
          <button class="swatch" data-set="demonslayer"  aria-label="Demon Slayer"></button>
          <button class="swatch" data-set="onepiece"     aria-label="One Piece"></button>
          <button class="swatch" data-set="spyfamily"    aria-label="Spy x Family"></button>
          <button class="swatch" data-set="chainsaw"     aria-label="Chainsaw Man"></button>
          <button class="swatch" data-set="frieren"      aria-label="Frieren"></button>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-card" id="hero-card">
        <div class="hero-art" id="hero-art" aria-hidden="true"></div>
        <div class="hero-eyebrow" id="hero-eyebrow">FEATURED</div>
        <h1 class="hero-title" id="hero-title">Loading…</h1>
        <div class="hero-meta" id="hero-meta"></div>
        <div class="hero-actions">
          <button class="btn">▶ Watch Now</button>
          <button class="btn btn--ghost">+ My List</button>
        </div>
      </div>

      <aside class="side-card" aria-labelledby="episodes-heading">
        <h3 id="episodes-heading">Latest Episodes</h3>
        <div class="episodes" id="episodes">
          <noscript>
            <p style="color:var(--text-muted);font-size:var(--text-sm)">
              JavaScript is required to load episode data.
            </p>
          </noscript>
        </div>
      </aside>
    </section>

    <noscript>
      <p style="padding:var(--space-6);color:var(--text-muted)">
        AniZone requires JavaScript to fetch anime data and images.
      </p>
    </noscript>

    <!-- TRENDING -->
    <section class="section">
      <header class="section-head">
        <div>
          <div class="section-title">Trending Now</div>
          <div class="section-sub">Updated daily based on viewer activity</div>
        </div>
        <a class="nav-link" href="#">View all →</a>
      </header>

      <div class="grid" id="grid" aria-live="polite" aria-busy="true">
        <div class="card" aria-hidden="true"><div class="card-art"></div><div class="card-body"><div class="card-title">&nbsp;</div><div class="card-meta">&nbsp;</div></div></div>
        <div class="card" aria-hidden="true"><div class="card-art"></div><div class="card-body"><div class="card-title">&nbsp;</div><div class="card-meta">&nbsp;</div></div></div>
        <div class="card" aria-hidden="true"><div class="card-art"></div><div class="card-body"><div class="card-title">&nbsp;</div><div class="card-meta">&nbsp;</div></div></div>
        <div class="card" aria-hidden="true"><div class="card-art"></div><div class="card-body"><div class="card-title">&nbsp;</div><div class="card-meta">&nbsp;</div></div></div>
        <div class="card" aria-hidden="true"><div class="card-art"></div><div class="card-body"><div class="card-title">&nbsp;</div><div class="card-meta">&nbsp;</div></div></div>
        <div class="card" aria-hidden="true"><div class="card-art"></div><div class="card-body"><div class="card-title">&nbsp;</div><div class="card-meta">&nbsp;</div></div></div>
      </div>
    </section>

    <footer class="footer">
      AniZone • Single-file prototype • Switch themes via the swatches in the nav
    </footer>
  </div>

<script>
  /* =========================================================
     DATA
     Each entry links a Wikipedia page (its `originalimage` and
     `thumbnail` are pulled; `originalimage` is the lead image,
     which for anime articles is the official key visual).
     `episodes` is illustrative metadata for the side panel.
     ========================================================= */
  const ANIME = [
    { title: "Jujutsu Kaisen",                  theme: "jujutsu",     tag: "Supernatural", episodes: [
      { n: 12, t: "To You, Someday",       d: "Sep 14 • 24m" },
      { n: 11, t: "The Shibuya Incident",  d: "Sep 07 • 24m" },
      { n: 10, t: "Black Flash",           d: "Aug 31 • 24m" }
    ]},
    { title: "Demon Slayer: Kimetsu no Yaiba",  theme: "demonslayer", tag: "Action",       episodes: [
      { n: 11, t: "A Connected Bond",      d: "Jun 30 • 24m" },
      { n: 10, t: "Never Give Up",         d: "Jun 23 • 24m" },
      { n:  9, t: "Butterfly Estate",      d: "Jun 16 • 24m" }
    ]},
    { title: "One Piece",                       theme: "onepiece",    tag: "Adventure",    episodes: [
      { n: 1122, t: "A Break in the Storm", d: "Sep 01 • 24m" },
      { n: 1121, t: "Luffy vs. Admiral",    d: "Aug 25 • 24m" },
      { n: 1120, t: "Egghead Arc",          d: "Aug 18 • 24m" }
    ]},
    { title: "Spy × Family",                    theme: "spyfamily",   tag: "Comedy",       episodes: [
      { n: 25, t: "Mission 75",            d: "Jun 24 • 24m" },
      { n: 24, t: "Mission 74",            d: "Jun 17 • 24m" },
      { n: 23, t: "Mission 73",            d: "Jun 10 • 24m" }
    ]},
    { title: "Chainsaw Man",                    theme: "chainsaw",    tag: "Action",       episodes: [
      { n: 12, t: "Katana vs. Chainsaw",   d: "Dec 28 • 24m" },
      { n: 11, t: "Go Get 'Em, Chainsaw Man", d: "Dec 21 • 24m" },
      { n: 10, t: "Humanity's Savior",     d: "Dec 14 • 24m" }
    ]},
    { title: "Frieren: Beyond Journey's End",  theme: "frieren",     tag: "Fantasy",      episodes: [
      { n: 28, t: "The Journey to Ende",   d: "Mar 22 • 24m" },
      { n: 27, t: "A Frieren Reunion",     d: "Mar 15 • 24m" },
      { n: 26, t: "The Exam's End",        d: "Mar 08 • 24m" }
    ]}
  ];

  /* ---- Theme switcher ---- */
  const swatches = document.querySelectorAll('.swatch');
  const root = document.body;

  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
    swatches.forEach(s => s.setAttribute('aria-pressed', String(s.dataset.set === theme)));
  }
  setTheme('jujutsu');

  swatches.forEach(btn => {
    btn.addEventListener('click', () => setTheme(btn.dataset.set));
  });

  /* ---- Wikipedia fetch with stagger to avoid rate-limits ---- */
  async function fetchWikiSummary(title) {
    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const res = await fetch(url, { headers: { 'Api-User-Agent': 'AniZone/1.0 (https://github.com/Nubby29/Android_WebApps)' } });
    if (!res.ok) throw new Error(`Wiki ${res.status}`);
    const d = await res.json();
    return {
      title: d.title,
      original: d.originalimage && d.originalimage.source,
      thumb: d.thumbnail && d.thumbnail.source
    };
  }

  /* Map API image to {src, w, h} using a 3:4 aspect for cards. */
  function thumbWithDims(url) {
    if (!url) return null;
    return { src: url, w: 300, h: 400 };
  }
  function heroWithDims(url) {
    if (!url) return null;
    return { src: url, w: 1200, h: 800 };
  }

  /* ---- Render: episodes ---- */
  function renderEpisodes(episodes) {
    const list = document.getElementById('episodes');
    list.innerHTML = '';
    episodes.forEach(ep => {
      const row = document.createElement('div');
      row.className = 'episode';
      row.innerHTML = `
        <div class="episode-num">${ep.n}</div>
        <div>
          <div class="episode-title"></div>
          <div class="episode-time"></div>
        </div>
        <button class="btn">Play</button>`;
      row.querySelector('.episode-title').textContent = ep.t;
      row.querySelector('.episode-time').textContent = ep.d;
      list.appendChild(row);
    });
  }

  /* ---- Render: hero ---- */
  function renderHero(item) {
    setTheme(item.theme);
    const art = document.getElementById('hero-art');
    const img = heroWithDims(item.original) || heroWithDims(item.thumb);
    if (img) {
      art.innerHTML = `<img src="${img.src}" width="${img.w}" height="${img.h}" alt="">`;
    } else {
      art.innerHTML = '';
    }
    const title = document.getElementById('hero-title');
    title.textContent = item.title;
    document.getElementById('hero-eyebrow').textContent = 'FEATURED';
    const meta = document.getElementById('hero-meta');
    meta.innerHTML = '';
    const tags = [
      { html: '<span class="badge"><span class="dot"></span>Trending</span>' },
      { text: item.tag },
      { text: 'Lead image' }
    ];
    tags.forEach(t => {
      const b = document.createElement('span');
      b.className = 'badge';
      if (t.html) b.innerHTML = t.html;
      else b.textContent = t.text;
      meta.appendChild(b);
    });
    renderEpisodes(item.episodes);
  }

  /* ---- Render: card (accessible <button>) ---- */
  function renderCard(item, rank) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    btn.setAttribute('aria-label', `Feature ${item.title}`);

    const img = thumbWithDims(item.thumb) || thumbWithDims(item.original);
    btn.innerHTML = `
      <div class="card-art" data-rank="${rank}">
        ${img ? `<img src="${img.src}" width="${img.w}" height="${img.h}" alt="" loading="lazy" decoding="async">` : ''}
      </div>
      <span class="card-rank" aria-hidden="true">Top ${rank}</span>
      <div class="card-body">
        <h3 class="card-title"></h3>
        <div class="card-meta"></div>
      </div>`;
    btn.querySelector('.card-title').textContent = item.title;
    btn.querySelector('.card-meta').innerHTML =
      `<span>${item.tag}</span><span>•</span><span>TV</span>`;

    if (img) {
      const realImg = btn.querySelector('img');
      realImg.addEventListener('load', () => {
        realImg.parentElement.classList.add('is-loaded');
      });
      realImg.addEventListener('error', () => {
        realImg.parentElement.classList.add('is-loaded');
      });
    } else {
      btn.querySelector('.card-art').classList.add('is-loaded');
    }

    btn.addEventListener('click', () => renderHero(item));
    return btn;
  }

  /* ---- Init: staggered fetches ---- */
  (async function init() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.setAttribute('aria-busy', 'true');

    // Stagger requests ~150ms apart to stay friendly to Wikipedia's rate limit.
    const results = [];
    for (const a of ANIME) {
      try {
        const info = await fetchWikiSummary(a.title);
        results.push({ ...a, ...info });
      } catch {
        results.push({ ...a, original: '', thumb: '' });
      }
      await new Promise(r => setTimeout(r, 150));
    }

    results.forEach((item, i) => grid.appendChild(renderCard(item, i + 1)));
    grid.setAttribute('aria-busy', 'false');
    renderHero(results[0]); // Jujutsu featured
  })();
</script>
</body>
</html>
