name: Deploy to Cloudflare Pages

# Direct-upload deploy using wrangler. Use this if you connected the repo
# directly to Cloudflare Pages (which builds on Cloudflare's side and does
# NOT need this workflow). This workflow is the alternative: it builds
# locally and uploads the dist/ artifact via the Cloudflare API.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: File_Keeper/package-lock.json

      - name: Install dependencies
        working-directory: File_Keeper
        run: npm ci

      - name: Generate PWA icons
        working-directory: File_Keeper
        run: node scripts/generate-icons.mjs

      - name: Build
        working-directory: File_Keeper
        run: npm run build
        env:
          VITE_BASE: /

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: file-keeper
          directory: File_Keeper/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
